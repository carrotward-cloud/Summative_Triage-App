name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js (use version 18 for compatibility)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3. Install dependencies (if package.json exists)
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, skipping npm install"
          fi

      # 4. Build the project (if build script exists)
      - name: Build project
        run: |
          if [ -f package.json ]; then
            npm run build --if-present
          else
            echo "No build step required"
          fi

      # 5. Lint HTML files
      - name: Validate HTML
        uses: Cyb3r-Jak3/html5validator-action@v1.0.0
        with:
          root: .
          blacklist: "node_modules"

      # 6. Lint CSS (optional)
      - name: Lint CSS
        run: |
          if [ -d "./css" ]; then
            npx stylelint "**/*.css" || true
          else
            echo "No CSS folder found"
          fi

      # 7. Lint JavaScript (optional)
      - name: Lint JavaScript
        run: |
          if [ -d "./js" ]; then
            npx eslint "**/*.js" || true
          else
            echo "No JS folder found"
          fi
